name: CI

# Shared checks for pull requests, main and pinned site builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      commit:
        description: Source commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:search-seo
      - run: bun run check
      - run: bun test tests/
      - name: Go server (format, vet, tests, self-check)
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go test ./...
          go run ./cmd/moenotes self-check
